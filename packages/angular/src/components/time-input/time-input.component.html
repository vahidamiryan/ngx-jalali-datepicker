<div class="ndp-input" [class.ndp-input--disabled]="disabled()">
  <div class="ndp-input__fields">
    <input
      #el
      type="text"
      class="ndp-input__field"
      [class.ndp-input__field--invalid]="invalid()"
      [id]="inputId()"
      [value]="text()"
      [placeholder]="placeholder()"
      [disabled]="disabled()"
      autocomplete="off"
      inputmode="numeric"
      maxlength="5"
      aria-haspopup="dialog"
      [attr.aria-expanded]="open()"
      [attr.aria-invalid]="invalid()"
      (input)="onInput(el.value)"
      (focus)="onFocus()"
      (blur)="onBlur()"
    />

    <button
      type="button"
      class="ndp-input__toggle"
      [attr.aria-label]="t().openCalendar"
      [attr.aria-expanded]="open()"
      [disabled]="disabled()"
      (click)="toggle()"
    >
      <ndp-icon name="clock" />
    </button>
  </div>

  @if (open()) {
    <button type="button" class="ndp-input__backdrop" [attr.aria-label]="t().close" (click)="close()"></button>
    <div class="ndp-input__popover" role="dialog">
      <ndp-time-picker
        [adapter]="adapter()"
        [labels]="labels()"
        [time]="currentTime()"
        [minuteStep]="minuteStep()"
        [disabled]="disabled()"
        [bordered]="false"
        (timeChange)="onTimeChange($event)"
      />
    </div>
  }
</div>
